[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bedtime-story-engine"
version = "1.0.0"
description = "A bounded, inspectable bedtime-story generation and evaluation workflow"
requires-python = ">=3.10"
dependencies = ["openai==1.109.1", "pydantic==2.11.9", "rich==14.1.0", "python-dotenv==1.2.4"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.13.1"]

[project.scripts]
bedtime = "story_engine.cli:main"

[tool.setuptools.packages.find]
include = ["story_engine*", "evals*"]

[tool.setuptools.package-data]
story_engine = ["prompts/*.md", "fixtures/*.json"]
evals = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
